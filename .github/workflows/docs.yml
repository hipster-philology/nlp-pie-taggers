name: Documentation

# The documentation is built on every push and pull request (a warning is an error), and published
# on GitHub Pages when master changes.
# Once: Settings > Pages > Build and deployment > Source: "GitHub Actions"
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]" --extra-index-url https://download.pytorch.org/whl/cpu
    - name: Build
      run: python -m sphinx -W --keep-going -b html docs docs/_build/html
    - name: Upload
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
