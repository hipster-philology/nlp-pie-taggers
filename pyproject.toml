[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pie_extended"
version = "0.1.6"
description = "Extension for nlp-pie package"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Thibault Clérice" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = [
    "PaPie>=0.6.1",
    "colorama>=0.4.4",
    "click>=7.0",
    "requests>=2.25",
    "unidecode>=1.1.1",
    "regex",
    "numpy",
]

[project.optional-dependencies]
# Models that run through spaCy (grc_grecy). The pipelines themselves are installed with `pie-extended install-addons`
grecy = ["spacy>=3.7", "grecy"]

# Documentation: `make docs` (see docs/)
docs = ["sphinx>=7.2", "furo", "myst-parser>=3.0", "sphinx-copybutton", "sphinx-click>=5.1"]

[project.urls]
Homepage = "https://github.com/hipster-philology/nlp-pie-taggers"

[project.scripts]
pie-extended = "pie_extended.cli.main:pie_ext"

[tool.setuptools.packages.find]
exclude = ["tests", "env", "venv"]
